name = "phishclaw-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Keys are Worker secrets, never in git and never in the extension:
#   pnpm wrangler secret put SAFE_BROWSING_KEY
#   pnpm wrangler secret put ABUSECH_KEY
# For local runs put test values in .dev.vars (gitignored).

# No request logging (STY-FR-02): request paths carry hostnames, request bodies carry hashes.
# Keep both off, and don't run `wrangler tail` against production.
logpush = false

[observability]
enabled = false

# 60 requests a minute per IP (C3 RATE_LIMIT_PER_MINUTE), exact: one RateLimiter Durable
# Object per client IP counts every request, whichever Cloudflare machine serves it.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# SQLite-backed, which the Workers free plan allows. Never edit a migration that has shipped;
# add a new tag instead.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
