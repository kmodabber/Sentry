[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-ml"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pandas", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["sentry_ml"]

[tool.ruff]
line-length = 100
