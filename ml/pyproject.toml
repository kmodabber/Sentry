[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-ml"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["pandas", "pyarrow", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["sentry_ml"]

[tool.ruff]
line-length = 100